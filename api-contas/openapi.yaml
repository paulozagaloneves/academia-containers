openapi: 3.1.0
info:
  title: TipsBank — API de Contas
  version: 1.0.0
  description: |
    Gere as contas bancárias do TipsBank: criação, consulta, ajuste de saldo e autenticação.

    Contrato de referência para a reescrita em .NET 10. **Não alterar** rotas, nomes de campos
    (snake_case) nem códigos HTTP — o frontend `web` e a `api-transacoes` dependem deles.

    Erros devolvem sempre um objeto JSON com o campo `detail` (compatível com `ProblemDetails`).
security: []   # APIs internas, sem autenticação (laboratório)
servers:
  - url: http://localhost:8081
    description: Acesso direto ao container (docker compose)
  - url: http://localhost:8080/api/contas
    description: Através do proxy reverso do frontend web
  - url: http://api-contas.tipsbank-contas.svc.cluster.local:8080
    description: Dentro do cluster Kubernetes
tags:
  - name: health
    description: Probes para Docker/Kubernetes
  - name: contas
    description: Gestão de contas
  - name: auth
    description: Autenticação
  - name: observabilidade
    description: Métricas Prometheus

paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness — o processo está vivo
      operationId: healthLive
      responses:
        "200":
          description: Processo a responder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok }

  /health/ready:
    get:
      tags: [health]
      summary: Readiness — a base de dados responde
      description: Executa `SELECT now()` no PostgreSQL. Só devolve 200 se a BD estiver acessível.
      operationId: healthReady
      responses:
        "200":
          description: Pronto a receber tráfego
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ready }
        "503":
          description: Base de dados indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example: { detail: db indisponivel }

  /health/startup:
    get:
      tags: [health]
      summary: Startup — a aplicação terminou o arranque
      operationId: healthStartup
      responses:
        "200":
          description: Arranque concluído
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: started }

  /metrics:
    get:
      tags: [observabilidade]
      summary: Métricas no formato de exposição Prometheus
      operationId: metrics
      responses:
        "200":
          description: Métricas em texto
          content:
            text/plain:
              schema: { type: string }
              example: |
                # HELP tipsbank_login_total Tentativas de login
                # TYPE tipsbank_login_total counter
                tipsbank_login_total{status="ok"} 3
                tipsbank_login_total{status="falhou"} 1
                # HELP http_requests_total Total de requisições HTTP
                # TYPE http_requests_total counter
                http_requests_total{method="GET",path="/contas",status="200"} 12

  /contas:
    post:
      tags: [contas]
      summary: Criar conta
      description: |
        Cria uma conta com `id` UUID v4 gerado pelo servidor. A senha é guardada como hash
        **bcrypt** (custo 10) na coluna `senha_hash` e **nunca** é devolvida.
      operationId: criarConta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContaIn" }
            examples:
              basico:
                summary: Conta nova com saldo inicial
                value:
                  titular: Maria Estagiária
                  documento: "11122233344"
                  senha: segredo123
                  saldo_inicial: "1000"
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContaOut" }
              example:
                id: 6f1c1d1e-7a2b-4c3d-9e8f-0a1b2c3d4e5f
                titular: Maria Estagiária
                documento: "11122233344"
                saldo: 1000.00
        "409":
          description: Já existe uma conta com este documento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example: { detail: documento ja cadastrado }
        "422":
          $ref: "#/components/responses/ErroValidacao"
    get:
      tags: [contas]
      summary: Listar contas
      operationId: listarContas
      parameters:
        - name: limit
          in: query
          description: Número máximo de contas. Valores acima de 200 são limitados a 200.
          schema: { type: integer, default: 50, minimum: 1 }
      responses:
        "200":
          description: Lista de contas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContaOut" }
              example:
                - id: 11111111-1111-1111-1111-111111111111
                  titular: Jeferson Fernando
                  documento: "12345678901"
                  saldo: 10000.00
                - id: 22222222-2222-2222-2222-222222222222
                  titular: LinuxTips SA
                  documento: "98765432100"
                  saldo: 500.00

  /contas/{conta_id}:
    get:
      tags: [contas]
      summary: Obter conta por id
      operationId: obterConta
      parameters:
        - $ref: "#/components/parameters/ContaId"
      responses:
        "200":
          description: Conta encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContaOut" }
              example:
                id: 11111111-1111-1111-1111-111111111111
                titular: Jeferson Fernando
                documento: "12345678901"
                saldo: 10000.00
        "404":
          $ref: "#/components/responses/ContaNaoEncontrada"

  /contas/{conta_id}/saldo:
    post:
      tags: [contas]
      summary: Ajustar saldo (crédito ou débito)
      description: |
        Usado pela `api-transacoes` durante uma transferência. A linha da conta deve ser
        bloqueada durante a operação (`SELECT ... FOR UPDATE` dentro de uma transação) para
        evitar condições de corrida com pedidos concorrentes.

        Um débito superior ao saldo disponível devolve **422** e não altera nada.
      operationId: ajustarSaldo
      parameters:
        - $ref: "#/components/parameters/ContaId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AjusteSaldo" }
            examples:
              credito:
                summary: Crédito (valor como string, tal como a api-transacoes envia)
                value: { valor: "50.00", operacao: credito }
              debito:
                summary: Débito (valor numérico também é aceite)
                value: { valor: 25.5, operacao: debito }
      responses:
        "200":
          description: Saldo atualizado; devolve a conta com o novo saldo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContaOut" }
              example:
                id: 11111111-1111-1111-1111-111111111111
                titular: Jeferson Fernando
                documento: "12345678901"
                saldo: 10050.00
        "404":
          $ref: "#/components/responses/ContaNaoEncontrada"
        "422":
          description: Saldo insuficiente (ou corpo inválido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example: { detail: saldo insuficiente }

  /login:
    post:
      tags: [auth]
      summary: Autenticar titular por documento + senha
      description: |
        Remove qualquer carácter não numérico do `documento` antes da pesquisa
        (`123.456.789-01` → `12345678901`) e valida a senha com bcrypt.
        Incrementa `tipsbank_login_total{status="ok"|"falhou"}`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginIn" }
            examples:
              comPontuacao:
                summary: CPF formatado (conta seed)
                value: { documento: 123.456.789-01, senha: giropops }
              soDigitos:
                summary: Só dígitos
                value: { documento: "98765432100", senha: giropops }
      responses:
        "200":
          description: Credenciais válidas; devolve a conta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContaOut" }
              example:
                id: 11111111-1111-1111-1111-111111111111
                titular: Jeferson Fernando
                documento: "12345678901"
                saldo: 10000.00
        "401":
          description: Documento inexistente ou senha errada (mesma resposta nos dois casos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example: { detail: credenciais invalidas }
        "422":
          $ref: "#/components/responses/ErroValidacao"

components:
  parameters:
    ContaId:
      name: conta_id
      in: path
      required: true
      description: Identificador da conta (UUID em texto)
      schema: { type: string, example: 11111111-1111-1111-1111-111111111111 }

  responses:
    ContaNaoEncontrada:
      description: Conta inexistente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example: { detail: conta nao encontrada }
    ErroValidacao:
      description: |
        Corpo inválido (campo em falta, tamanho fora dos limites, valor negativo...).
        A implementação de referência (FastAPI) devolve 422; em .NET é aceitável 400 ou 422,
        desde que o corpo contenha `detail`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }

  schemas:
    Decimal:
      description: |
        Valor monetário com 2 casas decimais. **Na entrada** deve aceitar número JSON ou
        string numérica ("1000", "25.50"). Na saída recomenda-se número JSON.
      oneOf:
        - type: number
        - type: string
          pattern: '^-?\d+(\.\d+)?$'

    ContaIn:
      type: object
      required: [titular, documento, senha]
      properties:
        titular:
          type: string
          minLength: 3
          maxLength: 120
        documento:
          type: string
          minLength: 11
          maxLength: 14
          description: CPF (11 dígitos). O frontend já envia só dígitos.
        senha:
          type: string
          minLength: 4
          maxLength: 72
          writeOnly: true
          description: Limite de 72 bytes imposto pelo bcrypt.
        saldo_inicial:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          default: 0
          description: Tem de ser >= 0.

    ContaOut:
      type: object
      required: [id, titular, documento, saldo]
      properties:
        id: { type: string, format: uuid }
        titular: { type: string }
        documento: { type: string }
        saldo: { $ref: "#/components/schemas/Decimal" }

    LoginIn:
      type: object
      required: [documento, senha]
      properties:
        documento: { type: string, minLength: 11, maxLength: 14 }
        senha: { type: string, minLength: 1, maxLength: 72, writeOnly: true }

    AjusteSaldo:
      type: object
      required: [valor, operacao]
      properties:
        valor: { $ref: "#/components/schemas/Decimal" }
        operacao:
          type: string
          enum: [credito, debito]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Erro:
      type: object
      required: [detail]
      properties:
        detail:
          description: Mensagem de erro (o frontend mostra-a ao utilizador).
          oneOf:
            - type: string
            - type: array
              description: Lista de erros de validação (formato FastAPI) — opcional
      additionalProperties: true
