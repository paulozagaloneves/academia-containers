# Credenciais da base de dados. Em ambiente real NUNCA versionar secrets em claro.
# Connection string no formato Npgsql (lida em .NET por GetConnectionString("TipsBank")).
apiVersion: v1
kind: Secret
metadata:
  name: contas-db-secret
  namespace: tipsbank-contas
type: Opaque
stringData:
  ConnectionStrings__TipsBank: "Host=postgres.tipsbank-contas.svc.cluster.local;Port=5432;Database=tipsbank;Username=tipsbank;Password=tipsbank"
  POSTGRES_DB: "tipsbank"
  POSTGRES_USER: "tipsbank"
  POSTGRES_PASSWORD: "tipsbank"
---
# A api-transacoes vive noutro namespace: precisa da sua própria cópia do Secret.
apiVersion: v1
kind: Secret
metadata:
  name: transacoes-db-secret
  namespace: tipsbank-transacoes
type: Opaque
stringData:
  ConnectionStrings__TipsBank: "Host=postgres.tipsbank-contas.svc.cluster.local;Port=5432;Database=tipsbank;Username=tipsbank;Password=tipsbank"
