apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels: { app: api-transacoes, team: transacoes, env: dev }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-transacoes }
  template:
    metadata:
      labels: { app: api-transacoes, team: transacoes, env: dev, version: v1 }
    spec:
      # A API e o sidecar correm com o mesmo UID/GID; fsGroup torna o emptyDir de logs gravável por ambos.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api-transacoes
          image: REGISTRY/tipsbank-api-transacoes:v1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ConnectionStrings__TipsBank
              valueFrom: { secretKeyRef: { name: transacoes-db-secret, key: ConnectionStrings__TipsBank } }
          envFrom:
            - configMapRef: { name: svc-url-endpoints }   # CONTAS_URL, AUDITORIA_URL, APP_VERSION, LOG_LEVEL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: transacoeslog
              mountPath: /var/log/app

        # Sidecar: reencaminha /var/log/app/app.log para o stdout do próprio container.
        #   kubectl logs -n tipsbank-transacoes deploy/api-transacoes -c log-forwarder -f
        - name: log-forwarder
          image: busybox:1.36.1-musl
          command: ["tail", "-F", "/var/log/app/app.log"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits:   { cpu: 100m, memory: 32Mi }
          startupProbe:
            exec: { command: ["sh", "-c", "[ -f /var/log/app/app.log ]"] }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: { command: ["sh", "-c", "[ -f /var/log/app/app.log ]"] }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: transacoeslog
              mountPath: /var/log/app
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: transacoeslog
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
  labels: { app: api-transacoes }
spec:
  type: ClusterIP
  selector: { app: api-transacoes }
  ports:
    - name: http
      port: 8080
      targetPort: http
